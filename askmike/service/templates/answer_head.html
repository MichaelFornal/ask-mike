{% include "_top.html" %}
<h1 class="visually-hidden">Answer</h1>
{% if label %}
<p class="label">{{ label }}</p>
{% endif %}
{% if asked %}
<p class="prose asked">{{ asked }}</p>
{% endif %}
{% if wait %}
<div class="reading">
{% if jd_label %}
<p class="label">{{ jd_label }}</p>
{% endif %}
<p class="wait">{{ wait }}<span class="dots">...</span></p>
<p class="visually-hidden">{{ wait_note }}</p>
</div>
{% endif %}
